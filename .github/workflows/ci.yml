name: VTR Standard CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint-and-quality:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Check code formatting (Black)
      run: black --check vtr_standard/
    - name: Linting (Ruff)
      run: ruff check vtr_standard/
    - name: Type checking (MyPy)
      run: mypy vtr_standard/

  schema-sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Verify JSON Schema is up to date
      run: |
        ./scripts/export_schema.py
        git diff --exit-code specs/vtr-sidecar.schema.json

  security-audits:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Dependency vulnerability audit
      run: pip-audit
    - name: Static Security Analysis (Bandit)
      run: bandit -r vtr_standard/

  test:
    needs: [lint-and-quality]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run Tests
      run: |
        export PYTHONPATH=$PYTHONPATH:.
        pytest
